services:
  - name: gapp-pg-db-backup
    type: cron
    schedule: "0 11 * * 0"
    region: oregon
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    envVars:
      - fromGroup: pg-backup-aws
      - key: DATABASE_URL
        fromDatabase:
          name: gapp-db
          property: connectionString
      - key: BACKUP_PREFIX
        value: gapp-pg-db
      - key: POSTGRES_VERSION
        value: "17" # copy from old backup-db → Environment
      - key: ALPINE_VERSION
        value: "3.21" # copy from old backup-db → Environment
  - name: salad-pg-db-backup
    type: cron
    schedule: "0 12 * * 0"
    region: oregon
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    envVars:
      - fromGroup: pg-backup-aws
      - key: DATABASE_URL
        fromDatabase:
          name: SALAD-postgres
          property: connectionString
      - key: BACKUP_PREFIX
        value: salad-pg-db
      - key: POSTGRES_VERSION
        value: "18"
      - key: ALPINE_VERSION
        value: "3.23"
